# Builds the site image on every push to main and pushes it to Docker Hub.
# The VPS pulls it on its own (deploy/update.sh) - GitHub never touches the VPS.
name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight build, so an older build can't
# overwrite :latest after a newer one.
concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Same value developer_instructions.txt passes by hand
      - name: Short commit hash
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ilikecontainers
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: GIT_COMMIT=${{ steps.commit.outputs.short }}
          tags: |
            ilikecontainers/personal-website:latest
            ilikecontainers/personal-website:${{ steps.commit.outputs.short }}
          # Reuses the pip install layer when requirments.txt hasn't changed
          cache-from: type=gha
          cache-to: type=gha,mode=max
